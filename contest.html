<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-head-title">PIMAX CONTESTS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="logo1.ico">
</head>
<body>

  <div id="page-content">
    <!-- HERO HEADER -->
    <section class="hero">
      <h1><a href="https://pimaxpro.github.io/pimaxcontests/" class="hero-title-link" id="hero-title">--</a></h1>
      <p class="hero-sub" id="hero-sub">--</p>
      <div class="social-wrapper" id="social-wrapper">
        <a href="https://www.tiktok.com/@pimaxghettoan" target="_blank" rel="noopener" class="social-card"><i class="fa-brands fa-tiktok"></i> <span class="divider">|</span> TikTok</a>
        <a href="https://www.facebook.com/PimaXPro" target="_blank" rel="noopener" class="social-card"><i class="fa-brands fa-facebook-f"></i> <span class="divider">|</span> Facebook</a>
      </div>
    </section>

    <div class="layout-2col">
      <!-- CỘT 1: SIDEBAR CỐ ĐỊNH DANH SÁCH BÀI THI -->
      <aside class="sidebar-column">
        
        <!-- BOX 1: DANH SÁCH BÀI THI -->
        <div class="sidebar-box sidebar-exams-box">
          <div class="sidebar-header"><h2><i class="fa-solid fa-folder-tree"></i> Danh sách Bài thi</h2></div>
          <div id="tree-menu" class="tree-menu"></div>
        </div>

        <!-- BOX 2: CỤM 2 NÚT HÀNH ĐỘNG -->
        <div class="sidebar-box sidebar-actions-box">
          <a href="https://pimaxtsa.com/" target="_blank" class="sidebar-action-btn btn-practice">
            <i class="fa-solid fa-laptop-code"></i>
            <span>Phòng luyện đề</span>
            <i class="fa-solid fa-arrow-up-right-from-square btn-arrow"></i>
          </a>

          <a href="https://www.facebook.com/PimaXPro/posts/pfbid051t7rUvFhrNKNnvoXe6m8bi7FBAiNGbHWiFhPiMA3P7pErcHGiPK8VVpzavSmawnl" target="_blank" class="sidebar-action-btn btn-course">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>Đăng ký khóa học</span>
            <i class="fa-solid fa-arrow-up-right-from-square btn-arrow"></i>
          </a>
        </div>

      </aside>

      <!-- CỘT 2: PREVIEW AREA (BOX TRẮNG DUY NHẤT BẰNG ĐẦU VỚI SIDEBAR BÊN TRÁI) -->
      <main class="preview-area">
        
        <!-- PHẦN XEM ĐỀ THI GOOGLE DRIVE -->
        <div class="preview-header">
          <div class="preview-title-row">
            <i class="fa-regular fa-file-lines doc-icon"></i>
            <h1 id="preview-title">Đang tải...</h1>
          </div>
          <div class="preview-meta-row">
            <div class="meta-item"><i class="fa-regular fa-calendar-days meta-icon"></i><span id="update-time-val">--/--/----</span></div>
            <div class="meta-item"><i class="fa-solid fa-hashtag meta-icon"></i><span id="subtitle-val">--</span></div>
            <div class="meta-item"><i class="fa-regular fa-clock meta-icon"></i><span id="exam-time-val">--</span></div>

            <div class="week-buttons">
              <button id="btn-answers" class="week-btn"><i class="fa-solid fa-key"></i> Đáp án</button>
              <a id="btn-ranking" class="week-btn" href="#" target="_blank" rel="noopener"><i class="fa-solid fa-chart-column"></i> Ranking</a>
              <a id="btn-solution" class="week-btn" href="#" target="_blank" rel="noopener"><i class="fa-solid fa-play"></i> Solution</a>
            </div>
          </div>
        </div>

        <!-- CONTAINER CHỨA IFRAME DRIVE -->
        <div class="drive-iframe-container">
          <div class="iframe-overlay-cover"></div>
          <div class="side-share-actions">
            <button id="btn-share-fb" class="side-share-btn" title="Chia sẻ Facebook"><i class="fa-brands fa-facebook-f"></i></button>
            <button id="btn-copy-link" class="side-share-btn" title="Chép liên kết"><i class="fa-solid fa-link"></i></button>
            <a id="btn-drive-link" class="side-share-btn" href="#" target="_blank" rel="noopener" title="Mở Drive"><i class="fa-brands fa-google-drive"></i></a>
          </div>
          <iframe id="drive-preview-iframe" src="" allow="autoplay" allowfullscreen></iframe>
        </div>

        <hr class="card-inner-divider">

        <!-- PHẦN ĐÁNH GIÁ 5 SAO & THỐNG KÊ -->
        <div class="rating-widget-section">
          <div class="rating-card-header">
            <h3><i class="fa-solid fa-star-half-stroke"></i> Đánh giá chất lượng đề thi</h3>
          </div>
          <div class="rating-body-grid">
            <div class="rating-summary-box">
              <div class="rating-big-score" id="rating-avg-num">5.0</div>
              <div class="rating-summary-stars" id="rating-summary-stars">
                <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>
              </div>
              <div class="rating-total-votes" id="rating-total-count">0 lượt đánh giá</div>

              <div class="user-vote-action">
                <p>Đánh giá của bạn:</p>
                <div class="user-stars-input" id="user-star-input">
                  <i class="fa-regular fa-star" data-value="1"></i>
                  <i class="fa-regular fa-star" data-value="2"></i>
                  <i class="fa-regular fa-star" data-value="3"></i>
                  <i class="fa-regular fa-star" data-value="4"></i>
                  <i class="fa-regular fa-star" data-value="5"></i>
                </div>
              </div>
            </div>

            <div class="rating-breakdown-box">
              <div class="star-bar-row">
                <span class="star-label">5 <i class="fa-solid fa-star"></i></span>
                <div class="progress-bar-bg"><div class="progress-bar-fill" id="star-bar-5"></div></div>
                <span class="star-count-num" id="star-count-5">0</span>
              </div>
              <div class="star-bar-row">
                <span class="star-label">4 <i class="fa-solid fa-star"></i></span>
                <div class="progress-bar-bg"><div class="progress-bar-fill" id="star-bar-4"></div></div>
                <span class="star-count-num" id="star-count-4">0</span>
              </div>
              <div class="star-bar-row">
                <span class="star-label">3 <i class="fa-solid fa-star"></i></span>
                <div class="progress-bar-bg"><div class="progress-bar-fill" id="star-bar-3"></div></div>
                <span class="star-count-num" id="star-count-3">0</span>
              </div>
              <div class="star-bar-row">
                <span class="star-label">2 <i class="fa-solid fa-star"></i></span>
                <div class="progress-bar-bg"><div class="progress-bar-fill" id="star-bar-2"></div></div>
                <span class="star-count-num" id="star-count-2">0</span>
              </div>
              <div class="star-bar-row">
                <span class="star-label">1 <i class="fa-solid fa-star"></i></span>
                <div class="progress-bar-bg"><div class="progress-bar-fill" id="star-bar-1"></div></div>
                <span class="star-count-num" id="star-count-1">0</span>
              </div>
            </div>
          </div>
        </div>

        <hr class="card-inner-divider">

        <!-- PHẦN BÌNH LUẬN & THẢO LUẬN -->
        <div class="comment-widget-section">
          <div class="comment-card-header">
            <h3><i class="fa-solid fa-comments"></i> Thảo luận & Thắc mắc <span id="comment-total-badge">(0)</span></h3>
          </div>

          <form id="cmt-submit-form" class="comment-form">
            <div class="form-inputs-row">
              <div class="input-group">
                <label for="cmt-user-name"><i class="fa-solid fa-user"></i> Họ và tên</label>
                <input type="text" id="cmt-user-name" placeholder="Ví dụ: Nguyễn Văn A" required>
              </div>
              <div class="input-group input-small">
                <label for="cmt-user-age"><i class="fa-regular fa-calendar"></i> Tuổi</label>
                <input type="number" id="cmt-user-age" min="10" max="99" placeholder="17" required>
              </div>
            </div>

            <div class="input-group">
              <label for="cmt-user-content"><i class="fa-solid fa-pen"></i> Nội dung trao đổi / Thắc mắc bài làm</label>
              <textarea id="cmt-user-content" rows="2" placeholder="Nhập câu hỏi hoặc cảm nhận của bạn về đề thi này..." required></textarea>
            </div>

            <div class="form-submit-row">
              <button type="submit" class="btn-submit-comment">
                <i class="fa-solid fa-paper-plane"></i> Gửi bình luận
              </button>
            </div>
          </form>

          <div id="comments-feed-list" class="comments-feed-list">
            <!-- Render tự động từ JS -->
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- SCRIPT MODULES -->
  <script src="assets/js/modules/ui-components.js"></script>
  <script src="assets/js/modules/menu-tree.js"></script>
  <script src="assets/js/modules/pdf-viewer.js"></script>
  <script src="assets/js/modules/answer-modal.js"></script>
  <script src="assets/js/modules/share-actions.js"></script>
  <script src="assets/js/modules/protection.js"></script>
  <script src="assets/js/modules/rating-comment.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
